<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Korki Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky app bar with role switch + tab row, then a single working surface per view.
   Motif: the squared exercise-book page (zeszyt w kratkę), its red margin line marks time and "now". */
:root{
  --paper:#F5F6FA; --surface:#FFFFFF; --sunk:#ECEFF6; --line:#DCE1EC; --line-2:#C5CCDD;
  --ink:#151A31; --ink-2:#4A5272; --ink-3:#7880A0;
  --accent:#2D43C4; --accent-ink:#FFFFFF; --accent-soft:#E5E9FC;
  --margin:#D9443F; --star:#C98400;
  --ok:#1D7F55; --warn:#A5660E; --bad:#BF3A30; --info:#2D43C4;
  --s-math:#4552D6; --s-phys:#7A4BC4; --s-bio:#2C8550; --s-chem:#C2701A; --s-eng:#C03D6B; --s-it:#11807F;
  --grid:rgba(45,67,196,.055); --grid-strong:rgba(45,67,196,.12);
  --scrim:rgba(14,18,40,.32);
  --shadow:0 1px 2px rgba(21,26,49,.06),0 10px 30px rgba(21,26,49,.10);
  --shadow-sm:0 1px 2px rgba(21,26,49,.10);
  --f-display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1120; --surface:#151A2C; --sunk:#1B2136; --line:#272E48; --line-2:#363E5C;
    --ink:#E7EAF6; --ink-2:#AEB4CF; --ink-3:#7D84A3;
    --accent:#8D9BFF; --accent-ink:#0E1120; --accent-soft:#232A55;
    --margin:#F2706A; --star:#F2C14E;
    --ok:#4CC28A; --warn:#E0A84A; --bad:#F07A70; --info:#8D9BFF;
    --s-math:#8C96FF; --s-phys:#B48CF5; --s-bio:#5CC488; --s-chem:#E9A050; --s-eng:#F07EA6; --s-it:#4CC9C6;
    --grid:rgba(141,155,255,.06); --grid-strong:rgba(141,155,255,.12);
    --scrim:rgba(4,6,14,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1120; --surface:#151A2C; --sunk:#1B2136; --line:#272E48; --line-2:#363E5C;
  --ink:#E7EAF6; --ink-2:#AEB4CF; --ink-3:#7D84A3;
  --accent:#8D9BFF; --accent-ink:#0E1120; --accent-soft:#232A55;
  --margin:#F2706A; --star:#F2C14E;
  --ok:#4CC28A; --warn:#E0A84A; --bad:#F07A70; --info:#8D9BFF;
  --s-math:#8C96FF; --s-phys:#B48CF5; --s-bio:#5CC488; --s-chem:#E9A050; --s-eng:#F07EA6; --s-it:#4CC9C6;
  --grid:rgba(141,155,255,.06); --grid-strong:rgba(141,155,255,.12);
  --scrim:rgba(4,6,14,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{font-family:var(--f-body);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:22px;line-height:1.2;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* App bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px 20px;padding-block:10px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-right:auto}
.brand svg{flex:none}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.theme-seg button{display:inline-flex;align-items:center;gap:6px}
.theme-seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.theme-seg span{display:none}.theme-seg button{padding:5px 9px}}
.lang-seg button{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.who{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;font-size:12px;font-weight:600;
  background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--surface));color:color-mix(in srgb,var(--c,var(--accent)) 75%,var(--ink));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
.av.lg{width:52px;height:52px;font-size:17px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:6px;padding:10px 12px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--margin);color:#fff}

main{padding-block:24px 72px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.page-head .sub{color:var(--ink-2);max-width:62ch;margin-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Buttons & controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.lbl .opt{font-weight:400;color:var(--ink-3)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:38px;height:22px;border-radius:11px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .15s}
.switch input:checked + .track{background:var(--ok)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.sm{height:26px;padding:0 9px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  color:var(--pc,var(--ink-3));background:color-mix(in srgb,var(--pc,var(--ink-3)) 13%,transparent)}
.pill.ok{--pc:var(--ok)} .pill.warn{--pc:var(--warn)} .pill.bad{--pc:var(--bad)} .pill.info{--pc:var(--info)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;background:color-mix(in srgb,var(--warn) 11%,var(--surface));color:color-mix(in srgb,var(--warn) 60%,var(--ink));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface));color:color-mix(in srgb,var(--bad) 70%,var(--ink));border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.notice.info{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.notice a,.linkish{color:var(--accent);font-weight:600;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.stat{padding:12px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:500}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--ink-3);margin-left:4px}
.stat.alert .v{color:var(--margin)}
@media (max-width:720px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}

/* Week calendar */
.cal-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal{min-width:760px;--hour:60px}
.cal-head,.cal-body{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr))}
.cal-head{border-bottom:1px solid var(--line)}
.cal-head > div:first-child{border-right:2px solid color-mix(in srgb,var(--margin) 55%,transparent)}
.dh{padding:8px 10px;border-left:1px solid var(--line);display:flex;align-items:baseline;gap:6px;min-width:0}
.cal-head .dh:nth-child(2){border-left:0}
.dh span{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.dh b{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.dh.today b{color:var(--surface);background:var(--margin);border-radius:6px;padding:0 6px}
.dh em{margin-left:auto;font-style:normal;font-size:11px;color:var(--bad);font-weight:600}
.gutter{position:relative;border-right:2px solid color-mix(in srgb,var(--margin) 55%,transparent)}
.gutter span{position:absolute;right:8px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);transform:translateY(-50%)}
.gutter span.first{transform:none;top:3px!important}
.col{position:relative;border-left:1px solid var(--line);background:var(--sunk);cursor:cell}
.cal-body .col:nth-child(2){border-left:0}
.col::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% var(--hour),100% calc(var(--hour)/4),calc(var(--hour)/4) calc(var(--hour)/4)}
.avail{position:absolute;left:0;right:0;background:var(--surface);z-index:0}
.col.past .avail{background:color-mix(in srgb,var(--surface) 55%,var(--sunk))}
.avail.extra{background:color-mix(in srgb,var(--ok) 9%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 45%,transparent)}
.ex-tag{position:absolute;right:4px;bottom:3px;z-index:2;border:0;background:none;font-family:var(--f-mono);font-size:10px;color:var(--ok);text-transform:uppercase;letter-spacing:.05em;padding:2px}
.off{position:absolute;left:0;right:0;z-index:2;border:0;border-block:1px solid color-mix(in srgb,var(--bad) 35%,transparent);text-align:left;padding:6px 8px;font-size:12px;font-weight:500;color:var(--bad);display:flex;align-items:flex-start;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 11%,var(--sunk)) 0 6px,var(--sunk) 6px 12px)}
.bk{position:absolute;left:4px;right:4px;z-index:3;border-radius:6px;padding:4px 7px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:0;font-size:12px;line-height:1.3;color:var(--ink);
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--surface));transition:transform .12s,box-shadow .12s}
.bk:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.bk .t{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2)}
.bk .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .s{color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.pending{border:1.5px dashed var(--c);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.bk.past{opacity:.55}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--margin);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--margin)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-2)}
.legend .l-av{background:var(--surface)}
.legend .l-un{background:var(--sunk)}
.legend .l-ex{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok)}
.legend .l-off{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 30%,var(--sunk)) 0 3px,var(--sunk) 3px 6px);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.legend .l-bk{background:color-mix(in srgb,var(--s-math) 25%,var(--surface));border-color:color-mix(in srgb,var(--s-math) 50%,transparent)}
.legend .l-pd{border:1.5px dashed var(--s-math);background:var(--surface)}
.legend .spacer{flex:1}
/* Calendar drag & drop */
.cal{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bk[data-drag],[data-exdrag]{cursor:grab}
body.dragging-cal,body.dragging-cal *{cursor:grabbing!important}
body.dragging-cal.resizing *{cursor:ns-resize!important}
.lifted{opacity:.3}
.avail.extra{color:var(--ok)}
.dghost{position:absolute;left:4px;right:4px;z-index:6;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;pointer-events:none;display:flex;flex-direction:column;overflow:hidden;
  border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface));box-shadow:var(--shadow);color:var(--ink)}
.dghost .t{font-family:var(--f-mono);font-size:10.5px;font-weight:500}
.dghost .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dghost .why{font-size:11px;font-weight:600}
.dghost.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.dghost.warn .why{color:var(--warn)}
.dghost.bad{border-color:var(--bad);border-style:dashed;background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.dghost.bad .why{color:var(--bad)}
.dghost.sel{left:0;right:0;border-radius:0;border-width:1.5px;border-style:dashed;box-shadow:none}
.rs{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:ns-resize;z-index:3}
.rs::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor;opacity:.5}
.move summary{cursor:pointer;font-weight:600;color:var(--accent);width:max-content}
.toast{display:flex;align-items:center;gap:14px}
.toast-undo{border:0;background:none;padding:0;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);overflow:auto;display:flex;flex-direction:column;gap:18px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px;animation:slide .2s ease}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink-3);font-size:12.5px}
.kv dd{margin:0;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm-box{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 28%,transparent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (max-width:640px){
  .drawer{top:auto;left:0;width:100%;max-height:88%;border-radius:16px 16px 0 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:rise .2s ease}
}

/* Schedules */
.sched-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.s-list{display:flex;flex-direction:column;gap:8px}
.s-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%}
.s-item:hover{border-color:var(--line-2)}
.s-item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.s-item .nm{font-weight:600;min-width:0}
.s-item .dt{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.mini{display:flex;align-items:flex-end;gap:3px;height:26px;grid-row:1/3;grid-column:2;align-self:center}
.mini i{width:5px;border-radius:2px;background:var(--accent);opacity:.75}
.mini i.z{background:var(--line-2);opacity:1}
.s-item .pill{justify-self:start}
.editor{padding:20px;display:flex;flex-direction:column;gap:22px}
.ed-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.ed-head .field{flex:1 1 260px}
.ed-head input[type=text]{font-family:var(--f-display);font-size:18px;font-weight:600;height:42px}
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,200px));gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.day-rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px 16px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.day-row:first-child{border-top:0}
.day-row.scale{padding-block:8px 0;border-top:0;background:transparent}
.day-row .dn{font-weight:600;padding-top:2px}
.day-row .dn small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;font-family:var(--f-mono)}
.tl{position:relative;height:12px;background:var(--sunk);border-radius:4px;margin:4px 0 10px;
  background-image:linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);background-size:calc(100%/16) 100%}
.tl i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
.tl i.bad{background:var(--bad)}
.tl-scale{position:relative;height:14px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.tl-scale span{position:absolute;transform:translateX(-50%)}
.rngs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rng{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:9px;background:var(--sunk)}
.rng input[type=time]{width:112px;height:30px;font-family:var(--f-mono);font-size:13px}
.rng.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm)}
.savebar.dirty{border-color:var(--accent);box-shadow:var(--shadow)}
.savebar .sum{font-size:13px;color:var(--ink-2)}
.savebar .sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.dirty-flag{display:none;color:var(--accent);font-weight:600;font-size:12.5px;margin-left:4px}
.savebar.dirty .dirty-flag{display:inline}
@media (max-width:900px){.sched-layout{grid-template-columns:1fr}.s-list{flex-direction:row;overflow-x:auto;padding-bottom:4px}.s-item{min-width:240px}}
@media (max-width:640px){
  .day-row{grid-template-columns:1fr auto}
  .day-row .day-main{grid-column:1/-1;grid-row:2}
  .day-row.scale{display:none}
  .editor{padding:16px}
  .dates{grid-template-columns:1fr 1fr}
}

/* Tables */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;min-width:900px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:18px}
.subj{display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;padding-top:4px}
.price{display:flex;align-items:center;gap:6px}
.price input{width:90px;font-family:var(--f-mono)}
.add-row{display:flex;gap:8px;margin-top:12px;max-width:420px}
.where{margin-top:24px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.where h3{grid-column:1/-1}

/* Lesson lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lesson{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.lesson:first-child{border-top:0}
.ldate{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:6px 0;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.ldate b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ldate span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.lmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.lline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.ltitle{font-weight:600;font-size:15px}
.lsub{font-size:13px;color:var(--ink-3)}
.lnote{font-size:13px;color:var(--ink-2);margin-top:2px}
.lact{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.lact .confirm-box{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px}
.lesson.dim{opacity:.7}
.section{margin-top:28px}
.section > .sec-head h2{font-size:18px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
@media (max-width:640px){.lesson{grid-template-columns:52px minmax(0,1fr)}.lact{grid-column:1/-1;justify-content:flex-start}}

/* Find a tutor */
.find{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.t-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.t-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%}
.t-card:hover{border-color:var(--line-2)}
.t-card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.t-card .av{grid-row:1/4}
.t-card .nm{font-weight:600;font-size:15px}
.t-card .hl{font-size:13px;color:var(--ink-2)}
.t-card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-3);margin-top:4px;align-items:center}
.t-card .meta b{color:var(--ink);font-weight:600}
.t-card .next{color:var(--ok);font-weight:500}
.panel{padding:20px;display:flex;flex-direction:column;gap:20px}
.p-head{display:flex;gap:14px;align-items:flex-start}
.p-head p{color:var(--ink-2);max-width:62ch;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wk-nav b{font-family:var(--f-display);font-weight:600;font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{display:flex;flex-direction:column;gap:6px;min-width:0}
.wday h4{margin:0 0 2px;font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);display:flex;gap:5px;align-items:baseline}
.wday h4 b{font-family:var(--f-display);font-size:16px;color:var(--ink);letter-spacing:0}
.wday.today h4 b{color:var(--margin)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{height:32px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.no-slots{font-size:12px;color:var(--ink-3);padding:6px 0}
.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;padding:16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);align-items:start}
.summary .big{font-family:var(--f-display);font-size:19px;font-weight:600;margin-top:2px}
.summary .go{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.summary.idle{background:transparent;border-style:dashed;border-color:var(--line-2);display:block;color:var(--ink-3);text-align:center}
@media (max-width:980px){.find{grid-template-columns:1fr}}
@media (max-width:720px){
  .week{grid-template-columns:1fr;gap:0}
  .wday{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
  .wday:first-child{border-top:0}
  .slots{flex-direction:row;flex-wrap:wrap}
  .slot{padding:0 10px}
  .summary{grid-template-columns:1fr}
  .panel{padding:16px}
}

/* Stars & reviews */
.stars{position:relative;display:inline-flex;vertical-align:-2px;line-height:0;flex:none}
.stars .base,.stars .fill{display:inline-flex}
.stars svg{width:var(--ss,14px);height:var(--ss,14px);flex:none}
.stars .base svg{fill:var(--line-2)}
.stars .fill{position:absolute;inset:0 auto 0 0;overflow:hidden}
.stars .fill svg{fill:var(--star)}
.rating{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.rating small{font-weight:400;color:var(--ink-3);font-size:12.5px}
.t-card > :not(.av){grid-column:2}
.rv-sum{display:grid;grid-template-columns:auto minmax(0,320px);gap:28px;align-items:center}
.rv-avg{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rv-avg b{font-family:var(--f-display);font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.dist{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dist div{display:grid;grid-template-columns:12px minmax(0,1fr) 20px;gap:8px;align-items:center}
.dist i{display:block;height:6px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden}
.dist i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--star);border-radius:3px}
.rv-list{display:flex;flex-direction:column}
.rv{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rv-first .rv:first-child{border-top:0}
.rv-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
.rv-top b{font-weight:600}
.rv p{max-width:68ch}
.verified{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.reply{margin-left:16px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:13px;color:var(--ink-2);max-width:68ch}
.reply b{display:block;font-size:12px;color:var(--ink);margin-bottom:2px}
.star-input{display:flex;gap:2px}
.star-input button{border:0;background:none;padding:2px;line-height:0;border-radius:6px}
.star-input svg{width:32px;height:32px;fill:var(--line-2);transition:fill .1s}
.star-input button.on svg{fill:var(--star)}
@media (max-width:560px){.rv-sum{grid-template-columns:1fr;gap:14px}}

/* Payments */
.owe{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.owe-card{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.owe-card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.owe-card .amt{font-family:var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.owe-card.overdue .amt{color:var(--bad)}
.paybox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbl.pay{min-width:780px}
.tbl.pay td{vertical-align:middle}
.tbl.pay .num{padding-top:12px}
.tbl .paybox{justify-content:flex-end}
.bk .due{position:absolute;top:4px;right:4px;font-family:var(--f-mono);font-size:9.5px;font-weight:500;line-height:14px;padding:0 4px;border-radius:4px;background:var(--warn);color:var(--surface)}
.bk.past.unpaid{opacity:.85}
.balance{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:16px}
.balance .amt{font-family:var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.prompt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.policy{padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px 28px;align-items:end;margin-bottom:28px}
.policy .terms{grid-column:1/-1;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:13px;color:var(--ink-2);max-width:none}
.policy .terms b{color:var(--ink)}
.lsub .late{color:var(--warn);font-weight:500}
@media (max-width:640px){.policy{grid-template-columns:1fr}}

/* Flow progress bar */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 20px;padding:0;list-style:none}
.flow li{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px;color:var(--ink-3)}
.flow li::before{content:"";height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.flow li.done::before{background:var(--ok)}
.flow li.cur::before{background:var(--accent)}
.flow li.fail::before{background:var(--bad)}
.flow li b{font-weight:600;font-size:13px;color:var(--ink)}
.flow li.todo b{color:var(--ink-3)}
.flow li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.flow{grid-template-columns:repeat(5,minmax(104px,1fr));overflow-x:auto;padding-bottom:4px}}

/* Lesson page */
.lp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.lp-main,.lp-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.lp .card{padding:18px}
.lp .card > h3{margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13px;margin-bottom:8px}
.back:hover{color:var(--accent)}
.quote{padding:10px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0;font-size:13.5px;white-space:pre-wrap}
.quote + .quote{margin-top:8px}
.quote small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;white-space:normal}
.live{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:var(--r);background:color-mix(in srgb,var(--margin) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--margin) 35%,transparent)}
.live b{font-family:var(--f-display);font-size:18px;font-weight:600}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--margin);margin-right:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.plan{white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.live-on .plan{font-size:17px}
.links{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.links li{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}
.links a{color:var(--accent);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.links a:hover{text-decoration:underline}
.links .kind{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);flex:none;width:54px}
.add-link{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;margin-top:8px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sum-grid .full{grid-column:1/-1}
.sum-read{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 16px;margin:0}
.sum-read dt{font-size:12.5px;color:var(--ink-3);padding-top:2px}
.sum-read dd{margin:0;min-width:0}
.thread{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;margin-bottom:10px}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13.5px;background:var(--sunk);align-self:flex-start;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;white-space:normal}
.composer{display:flex;gap:8px;align-items:flex-end}
.next-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.next-card .big{font-family:var(--f-display);font-size:18px;font-weight:600}
.opts3{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface)}
.opt-btn:hover{border-color:var(--accent)}
.opt-btn b{font-weight:600}
.opt-btn span{font-size:12.5px;color:var(--ink-3)}
a.ltitle{color:inherit;text-decoration:none}
a.ltitle:hover{color:var(--accent)}
.hint.late{color:var(--warn);font-weight:500}
input[type=email],input[type=tel],input[type=password]{height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
@media (max-width:980px){.lp{grid-template-columns:1fr}}
@media (max-width:640px){.sum-grid,.add-link{grid-template-columns:1fr}.sum-read{grid-template-columns:1fr;gap:2px 0}.sum-read dd{margin-bottom:10px}}

/* Profile & share link */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
.step{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:none;border:0;border-left:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.step:first-child{border-left:0}
.step:hover b{color:var(--accent)}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--line-2);color:var(--ink-3)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step b{display:block;font-weight:600;font-size:13.5px}
.step small{display:block;font-size:12.5px;color:var(--ink-3)}
.prof{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.prof-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.card.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
.share{position:sticky;top:120px;padding:20px;display:flex;flex-direction:column;gap:14px}
.share-link{display:flex;gap:6px}
.share-link input{font-family:var(--f-mono);font-size:12.5px}
.qr{align-self:center;padding:12px;background:#fff;border-radius:10px;border:1px solid var(--line);line-height:0;min-width:174px;min-height:174px;display:grid;place-items:center}
.qr img,.qr canvas{width:150px;height:150px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:color-mix(in srgb,var(--ok) 70%,var(--ink));border:1px solid color-mix(in srgb,var(--ok) 25%,transparent)}
.edu{font-size:13.5px;white-space:pre-wrap}
.edu b{color:var(--ink);font-weight:600}
@media (max-width:980px){.prof{grid-template-columns:1fr}.share{position:static}}

/* Level surcharges */
.tbl tr:has(+ .extra-row) td{border-bottom:0}
.extra-row td{padding-top:0}
.extras{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.extra-list{display:flex;flex-wrap:wrap;gap:8px}
.lvx{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.lvx .ex-in{display:inline-flex;align-items:center;gap:3px;color:var(--ink-3)}
.lvx input{width:64px;height:28px;font-family:var(--f-mono);font-size:13px;padding:0 6px}
.lvx b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink-2);min-width:62px;text-align:right}

/* Checkout & confirmation */
.co-sum{padding:14px;border-radius:var(--r);background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.co-sum .big{font-family:var(--f-display);font-size:18px;font-weight:600}
.co-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px}
.co-total b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stripe{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.stripe svg{flex:none}
.done-mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.benefits{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.benefits li{display:flex;gap:8px}
.benefits li::before{content:"✓";color:var(--ok);font-weight:700}
.guest-bar{margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px);animation:rise .2s ease}
.foot{margin-top:40px;font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- availability engine ---------- */
function scheduleFor(t, d){ const k = key(d); return t.schedules.find(s => s.active && s.from <= k && k <= s.to) || null; }
function rulesFor(t, d){ return (scheduleFor(t, d) || t.schedules.find(s => s.active) || {rules:DEFAULT_RULES}).rules; }
function subtract(ranges, s, e){ const out = []; for (const r of ranges){ if (e <= r.s || s >= r.e){ out.push(r); continue; } if (s > r.s) out.push({...r, e:s}); if (e < r.e) out.push({...r, s:e}); } return out; }
function rangesFor(t, d){
  const k = key(d), sc = scheduleFor(t, d);
  let r = sc ? sc.week[DAYS[dayIdx(d)]].map(x => ({s:toMin(x.start), e:toMin(x.end)})).filter(x => x.e > x.s) : [];
  const ex = t.exceptions.filter(x => x.date === k);
  ex.filter(x => x.type === 'extra').forEach(x => r.push({s:toMin(x.start), e:toMin(x.end), extra:true, exId:x.id}));
  ex.filter(x => x.type === 'off').forEach(x => { r = subtract(r, toMin(x.start), toMin(x.end)); });
  return r.sort((a,b) => a.s - b.s);
}
const live = b => b.status === 'confirmed' || b.status === 'pending';
const bStart = b => { const d = parseKey(b.date); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, toMin(b.start)); };
const bEnd = b => toTime(toMin(b.start) + b.duration);
const isPast = b => !!b.done || bStart(b).getTime() + b.duration*6e4 < Date.now();
function slotsFor(t, d, dur){
  const rules = rulesFor(t, d), k = key(d), base = parseKey(k).getTime();
  const earliest = Date.now() + rules.notice*36e5;
  const latest = TODAY.getTime() + rules.horizon*7*864e5 + 864e5;
  const bs = BOOKINGS.filter(b => b.tutorId === t.id && b.date === k && live(b));
  const out = new Set();
  for (const r of rangesFor(t, d)){
    for (let m = r.s; m + dur <= r.e; m += rules.step){
      const ts = base + m*6e4;
      if (ts < earliest || ts > latest) continue;
      if (bs.some(b => { const s = toMin(b.start), e = s + b.duration; return m < e + rules.buffer && m + dur + rules.buffer > s; })) continue;
      out.add(m);
    }
  }
  return [...out].sort((a,b) => a-b);
}

(function sampleLateLesson(){
  const clash = (bs, m, dur, gap) => bs.some(b => m < toMin(b.start) + b.duration + gap && m + dur + gap > toMin(b.start));
  for (const t of ['t3','t2','t4','t1'].map(tutor)) for (let i = 0; i < 3; i++){

      const ts = base + m*6e4;
      if (ts < Date.now() + 2*36e5 || ts > Date.now() + (t.policy.cancelHours - 1)*36e5) continue;
      if (clash(BOOKINGS.filter(b => b.tutorId === t.id && b.date === k && live(b)), m, 60, 15)) continue;

/* ---------- Tutor: calendar drag & drop ---------- */
const SNAP = 15;
let drag = null, swallowClick = false;
const snapM = m => Math.round(m / SNAP) * SNAP;
const clampM = (m, lo, hi) => Math.max(lo, Math.min(hi, m));
function colAt(x){
  let best = null, bd = Infinity;
  document.querySelectorAll('.cal-body .col').forEach(c => { const r = c.getBoundingClientRect(); const dd = x < r.left ? r.left - x : x > r.right ? x - r.right : 0; if (dd < bd){ bd = dd; best = c; } });
  return best;
}
const minAt = (col, y) => CAL_START + (y - col.getBoundingClientRect().top);
const exName = x => tx(x.note) || (x.type === 'off' ? T('Blocked time','Zablokowany czas') : T('Extra hours','Dodatkowe godziny'));
function moveCheck(b, date, s){
  const e = s + b.duration;
  if (parseKey(date).getTime() + s*6e4 < Date.now()) return ['bad',T('That time has passed','Ten termin już minął')];
  const over = x => x !== b && x.date === date && live(x) && s < toMin(x.start) + x.duration && e > toMin(x.start);
  const hit = BOOKINGS.find(x => x.tutorId === b.tutorId && over(x));
  if (hit) return ['bad',T(`Clashes with ${hit.student}`,`Koliduje z lekcją: ${hit.student}`)];
  const own = BOOKINGS.find(x => x.student === b.student && over(x));
  if (own) return ['bad',T(`${b.student.split(' ')[0]} has another lesson then`,`${b.student.split(' ')[0]} ma wtedy inną lekcję`)];
  if (!rangesFor(tutor(b.tutorId), parseKey(date)).some(r => s >= r.s && e <= r.e)) return ['warn',T('Outside your hours','Poza Twoimi godzinami')];
  return ['ok',''];
}
function exCheck(x, date, s, e, fixed){
  if (fixed ? date < key(TODAY) : parseKey(date).getTime() + e*6e4 < Date.now()) return ['bad',T('That time has passed','Ten termin już minął')];
  if (x.type === 'off'){
    const n = BOOKINGS.filter(b => b.tutorId === ME && b.date === date && live(b) && toMin(b.start) < e && toMin(b.start) + b.duration > s).length;
    if (n) return ['warn',T(`${P(n,'lesson')} booked inside`,`Zarezerwowane lekcje w tym czasie: ${n}`)];
  }
  return ['ok',''];
}
function moveBooking(b, date, s, outside){
  const prev = {date:b.date, start:b.start, movedFrom:b.movedFrom};
  b.movedFrom = b.movedFrom || {date:b.date, start:b.start};
  b.date = date; b.start = toTime(s);
  if (b.movedFrom.date === b.date && b.movedFrom.start === b.start) b.movedFrom = null;
  ui.calWeek = weeksBetween(TODAY, parseKey(date));
  render();
  const when = `${fmtDay(parseKey(date))}, ${b.start}`, who = esc(b.student), first = esc(b.student.split(' ')[0]), notify = b.status === 'confirmed';
  toast(T(`${who} moved to ${when}.${outside ? ' That’s outside your usual hours.' : ''}${notify ? ` ${first} will be notified.` : ''}`,
          `Przeniesiono lekcję (${who}) na ${when}.${outside ? ' To poza Twoimi zwykłymi godzinami.' : ''}${notify ? ` Uczeń dostanie powiadomienie.` : ''}`),
    () => { Object.assign(b, prev); ui.calWeek = weeksBetween(TODAY, parseKey(b.date)); render(); toast(T('Move undone','Cofnięto przeniesienie')); });
}
function changeEx(x, patch){
  const prev = {date:x.date, start:x.start, end:x.end};
  Object.assign(x, patch); render();
  const whole = toMin(x.start) <= CAL_START && toMin(x.end) >= CAL_END;
  const [, warn] = exCheck(x, x.date, toMin(x.start), toMin(x.end), whole);
  const when = `${fmtDay(parseKey(x.date))}, ${whole ? T('all day','cały dzień') : `${x.start}–${x.end}`}`;
  toast(`${x.type === 'off' ? T('Blocked time now','Zablokowany czas:') : T('Extra hours now','Dodatkowe godziny:')} ${when}.${warn ? ` ${warn}${T(', still booked.','. Lekcje pozostają aktywne.')}` : ''}`,
    () => { Object.assign(x, prev); render(); toast(T('Change undone','Cofnięto zmianę')); });
}
function dragStart(e){
  swallowClick = false;
  if (ui.view !== 'calendar' || drag || ui.drawer || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const t = e.target, me = tutor(ME), col = t.closest('.cal-body .col');
  if (!col) return;
  const d = {x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, pid:e.pointerId, touch:e.pointerType !== 'mouse', active:false, col, date:col.dataset.date};
  const m0 = minAt(col, e.clientY);
  let el;
  if ((el = t.closest('.rs'))){
    const x = me.exceptions.find(q => q.id === el.dataset.id); if (!x) return;
    Object.assign(d, {kind:'resize', ex:x, lift:el.closest('[data-exdrag]'), s:toMin(x.start), e:toMin(x.end), name:exName(x)});
  } else if ((el = t.closest('.bk'))){
    if (!el.hasAttribute('data-drag')) return;
    const b = BOOKINGS.find(q => q.id === el.dataset.id); if (!b) return;
    Object.assign(d, {kind:'move-bk', b, lift:el, dur:b.duration, grab:m0 - toMin(b.start), name:b.student});
  } else if ((el = t.closest('[data-exdrag]'))){
    const x = me.exceptions.find(q => q.id === el.dataset.id); if (!x) return;
    const os = toMin(x.start), oe = toMin(x.end);
    Object.assign(d, {kind:'move-ex', ex:x, lift:el, os, oe, dur:oe - os, grab:m0 - Math.max(os, CAL_START), fixed:os <= CAL_START && oe >= CAL_END, name:exName(x)});
  } else if (t.closest('.bk, button')) return;
  else Object.assign(d, {kind:'create', anchor:clampM(Math.floor(m0 / SNAP) * SNAP, CAL_START, CAL_END - SNAP)});
  drag = d;
  if (d.touch) d.timer = setTimeout(() => { if (drag === d) dragActivate(); }, 380);
}
function dragActivate(){
  const d = drag; d.active = true; clearTimeout(d.timer);
  document.body.classList.add('dragging-cal');
  if (d.kind === 'resize') document.body.classList.add('resizing');
  d.lift?.classList.add('lifted');
  if (d.touch) navigator.vibrate?.(12);
  dragUpdate(); requestAnimationFrame(dragScroll);
}
function dragUpdate(){
  const d = drag; if (!d || !d.active) return;
  let col = d.col;
  if (d.kind === 'move-bk' || d.kind === 'move-ex'){
    col = colAt(d.x) || col;
    if (d.fixed){ d.s = d.os; d.e = d.oe; }
    else { const dur = Math.min(d.dur, CAL_END - CAL_START); d.s = clampM(snapM(minAt(col, d.y) - d.grab), CAL_START, CAL_END - dur); d.e = d.s + d.dur; }
  } else if (d.kind === 'resize'){
    d.e = clampM(snapM(minAt(col, d.y)), d.s + SNAP, CAL_END);
  } else {
    const m = clampM(snapM(minAt(col, d.y)), CAL_START, CAL_END);
    if (m > d.anchor){ d.s = d.anchor; d.e = Math.max(m, d.anchor + SNAP); } else { d.s = m; d.e = d.anchor + SNAP; }
  }
  d.date = col.dataset.date;
  [d.state, d.why] = d.kind === 'move-bk' ? moveCheck(d.b, d.date, d.s) : d.kind === 'create' ? ['ok', ''] : exCheck(d.ex, d.date, d.s, d.e, d.fixed);
  if (d.kind === 'create'){
    const inside = rangesFor(tutor(ME), parseKey(d.date)).some(r => d.s < r.e && d.e > r.s);
    d.why = inside ? T('Block this time','Zablokuj ten czas') : T('Add as extra hours','Dodaj jako dodatkowe godziny');
  }
  if (!d.ghost) d.ghost = document.createElement('div');
  d.ghost.className = `dghost ${d.state}${d.kind === 'create' ? ' sel' : ''}`;
  if (d.ghost.parentNode !== col) col.appendChild(d.ghost);
  const vs = Math.max(d.s, CAL_START), ve = Math.min(d.e, CAL_END);
  d.ghost.style.top = (vs - CAL_START) + 'px';
  d.ghost.style.height = Math.max(ve - vs, SNAP) + 'px';
  d.ghost.innerHTML = `<span class="t">${wdShort(parseKey(d.date))} ${d.fixed ? T('all day','cały dzień') : `${toTime(d.s)}–${toTime(d.e)}`}</span>${d.name ? `<span class="n">${esc(d.name)}</span>` : ''}${d.why ? `<span class="why">${esc(d.why)}</span>` : ''}`;
}
function dragScroll(){
  const d = drag; if (!d || !d.active) return;
  const head = $('.top').getBoundingClientRect().bottom, wrap = $('.cal-wrap');
  let dy = 0;
  if (d.y < head + 36) dy = -12; else if (d.y > innerHeight - 36) dy = 12;
  if (dy) scrollBy(0, dy);
  let dx = 0;
  if (wrap && (d.kind === 'move-bk' || d.kind === 'move-ex')){ const r = wrap.getBoundingClientRect(); if (d.x < r.left + 30) dx = -10; else if (d.x > r.right - 30) dx = 10; if (dx) wrap.scrollLeft += dx; }
  if (dy || dx) dragUpdate();
  requestAnimationFrame(dragScroll);
}
function dragMove(e){
  const d = drag; if (!d || e.pointerId !== d.pid) return;
  d.x = e.clientX; d.y = e.clientY;
  if (!d.active){
    const dist = Math.hypot(d.x - d.x0, d.y - d.y0);
    if (d.touch){ if (dist > 8){ clearTimeout(d.timer); drag = null; } return; }
    if (dist < 5) return;
    dragActivate();
  }
  e.preventDefault(); dragUpdate();
}
function dragEnd(e){
  const d = drag; if (!d || (e && e.pointerId !== d.pid)) return;
  clearTimeout(d.timer); drag = null;
  document.body.classList.remove('dragging-cal', 'resizing');
  if (!d.active) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 400);
  if (!e || e.type === 'pointercancel'){ render(); return; }
  if (d.kind === 'create'){
    const inside = rangesFor(tutor(ME), parseKey(d.date)).some(r => d.s < r.e && d.e > r.s);
    ui.drawer = {type:'exform', kind: inside ? 'off' : 'extra', date:d.date, start:toTime(d.s), end:toTime(d.e), note:'', allDay:false};
    render(); return;
  }
  if (d.state === 'bad'){ render(); toast(T(`Can’t move it there. ${esc(d.why)}.`,`Nie można tam przenieść. ${esc(d.why)}.`)); return; }
  if (d.kind === 'move-bk'){
    if (d.b.date === d.date && toMin(d.b.start) === d.s){ render(); return; }
    moveBooking(d.b, d.date, d.s, d.state === 'warn');
  } else {
    const x = d.ex, patch = d.fixed ? {date:d.date} : {date:d.date, start:toTime(d.s), end:toTime(d.e)};
    if (Object.entries(patch).every(([k, v]) => x[k] === v)){ render(); return; }
    changeEx(x, patch);
  }
}

/* ---------- Tutor: schedules ---------- */
const TL0 = 6*60, TL1 = 22*60;
function schedState(s){
  const k = key(TODAY);
  if (!s.active) return [T('Draft','Szkic'),''];
  if (s.from <= k && k <= s.to) return [T('In use now','Obowiązuje teraz'),'ok'];
  if (s.from > k) return [`${T('Starts','Od')} ${fmtDM(parseKey(s.from))}`,'info'];
  return [T('Ended','Zakończony'),''];
}
function dayErrors(ranges){
  const errs = new Set();
  ranges.forEach((r,i) => { if (toMin(r.end) <= toMin(r.start)) errs.add(i); });
  const sorted = ranges.map((r,i) => ({s:toMin(r.start), e:toMin(r.end), i})).sort((a,b) => a.s-b.s);
  for (let j = 1; j < sorted.length; j++) if (sorted[j].s < sorted[j-1].e){ errs.add(sorted[j].i); errs.add(sorted[j-1].i); }
  return errs;
}
function tlBars(ranges){
  const errs = dayErrors(ranges);
  return ranges.map((r,i) => {
    const s = Math.max(TL0, Math.min(TL1, toMin(r.start))), e = Math.max(TL0, Math.min(TL1, toMin(r.end)));
    if (e <= s) return '';
    return `<i class="${errs.has(i)?'bad':''}" style="left:${(s-TL0)/(TL1-TL0)*100}%;width:${(e-s)/(TL1-TL0)*100}%"></i>`;
  }).join('');
}
function schedSummary(){
  const d = ui.draft, buf = d.rules.buffer;
  let mins = 0, lessons = 0;
  DAYS.forEach(k => d.week[k].forEach(r => { const len = toMin(r.end) - toMin(r.start); if (len > 0){ mins += len; lessons += Math.floor((len + buf)/(60 + buf)); } }));
  const days = DAYS.filter(k => d.week[k].length).length;
  return T(
    `<b>${hrs(mins)} h</b> a week across <b>${P(days,'day')}</b>, room for up to <b>${lessons}</b> one-hour lessons with ${buf}-minute breaks.`,
    `<b>${hrs(mins)} h</b> tygodniowo, rozłożone na <b>${P(days,'day')}</b>. Mieści się do <b>${lessons}</b> lekcji 60-minutowych z ${buf}-minutowymi przerwami.`)
    + `<span class="dirty-flag">${T('Unsaved changes','Niezapisane zmiany')}</span>`;
}
function schedIssues(){
  const d = ui.draft, me = tutor(ME), out = [];
  if (d.from > d.to) out.push(['bad',T('The end date is before the start date.','Data końcowa jest wcześniejsza niż początkowa.')]);
  if (DAYS.some(k => dayErrors(d.week[k]).size)) out.push(['bad',T('Some hours overlap or end before they start. Fix the red times to save.','Niektóre godziny nachodzą na siebie albo kończą się przed rozpoczęciem. Popraw czerwone pola, aby zapisać.')]);
  if (!d.rules.durations.length) out.push(['bad',T('Pick at least one lesson length.','Wybierz co najmniej jedną długość lekcji.')]);
  const clash = d.active && me.schedules.find(s => s.id !== d.id && s.active && s.from <= d.to && d.from <= s.to);
  if (clash) out.push(['warn',T(`These dates overlap with “${esc(tx(clash.name))}”. Where they overlap, the schedule higher in the list wins.`,`Te daty pokrywają się z grafikiem „${esc(tx(clash.name))}”. W tych dniach obowiązuje grafik wyżej na liście.`)]);
  return out;
}
const schedBlocking = () => schedIssues().some(([t]) => t === 'bad');
function ensureDraft(){
  const me = tutor(ME);
  if (!me.schedules.some(s => s.id === ui.schedId)) ui.schedId = me.schedules[0]?.id;
  if (!ui.schedId){ ui.draft = null; return; }
  if (!ui.draft || ui.draft.id !== ui.schedId){ ui.draft = clone(me.schedules.find(s => s.id === ui.schedId)); ui.dirty = false; ui.confirmDelete = false; }
}

/* ---------- lesson rows ---------- */
const byStart = (a,b) => bStart(a) - bStart(b);
function lessonRow(b, who){
  const st = bStart(b), t = tutor(b.tutorId), past = isPast(b), pay = payOf(b, who);
  const open = (label, cls = 'ghost') => `<a class="btn ${cls} sm" href="#l-${b.id}">${label}</a>`;
  let act = '';
  if (who === 'tutor'){
    if (b.status === 'pending' && !past) act = `<button class="btn primary sm" data-act="accept" data-id="${b.id}">${T('Accept','Akceptuj')}</button><button class="btn sm" data-act="decline" data-id="${b.id}">${T('Decline','Odrzuć')}</button>`;
    else if (needsNotes(b)) act = open(T('Add notes','Dodaj notatki'), 'primary');
    else if (b.forfeit) act = `<button class="btn sm" data-act="refund" data-id="${b.id}">${T('Refund','Zwróć')} ${money(b.price)}</button>`;
    else act = open(T('Open','Otwórz'));
  } else {
    if (live(b) && !past) act = open(T('Details','Szczegóły'), '');
    else if (b.status === 'confirmed'){
      const latest = BOOKINGS.filter(x => x.tutorId === t.id && x.student === STUDENT.name && x.status === 'confirmed' && isPast(x)).sort(byStart).pop();
      act = (b.summary ? open(T('Notes','Notatki'), '') : open(T('Open','Otwórz')))
        + (latest === b ? `<button class="btn sm" data-act="review" data-tutor="${t.id}" data-id="${b.id}">${myReview(t.id) ? T('Edit review','Edytuj opinię') : T('Write a review','Napisz opinię')}</button>` : '')
        + `<button class="btn ghost sm" data-act="again" data-id="${b.id}">${T('Book again','Zarezerwuj ponownie')}</button>`;
    } else act = open(T('Open','Otwórz'));
  }
  const flags = [];
  if (pay && pay[1] !== 'ok') flags.push(`<span class="pill ${pay[1]}">${pay[0]}</span>`);
  if (b.summary) flags.push(`<span class="pill info">${T('Notes','Notatki')}</span>`);
  if (who === 'tutor' && b.feedback) flags.push(`<span class="pill ${b.feedback.clear ? 'ok' : 'warn'}">${b.feedback.clear ? T('All clear','Wszystko jasne') : T('Wants a recap','Prosi o powtórkę')}</span>`);
  if (b.msgs.length && live(b) && !past) flags.push(`<span class="pill">${T(`${b.msgs.length} msg`,`wiad.: ${b.msgs.length}`)}</span>`);
  return `<li class="lesson${past || !live(b) ? ' dim' : ''}" style="--c:var(--s-${b.subject})">
    <div class="ldate"><span>${wdShort(st)}</span><b>${st.getDate()}</b><span>${monShort(st)}</span></div>
    <div class="lmain">
      <div class="lline"><span class="mono">${b.start}–${bEnd(b)}</span><span><i class="dot"></i> ${sname(b.subject)}</span>${pill(b)}${flags.join('')}</div>
      <a class="ltitle" href="#l-${b.id}">${esc(who === 'tutor' ? b.student : t.name)}</a>
      <div class="lsub">${esc(lv(b.level))} · ${modeName(b.mode)} · ${b.duration} min · ${money(b.price)}${who === 'student' && b.status === 'confirmed' && !past
        ? (isLate(b) ? ` · <span class="late">${T('Free cancellation ended','Termin bezpłatnego odwołania minął')}</span>` : ` · ${T('Free cancellation until','Bezpłatne odwołanie do')} ${fmtWhen(cancelBy(b))}`) : ''}</div>
      ${tx(b.note) ? `<div class="lnote">„${esc(tx(b.note))}”</div>` : ''}
      ${b.movedFrom && live(b) ? `<div class="lsub">${who === 'student' ? T(`Moved by ${esc(firstName(t))} from`,`Przeniesiona przez korepetytora (${esc(firstName(t))}) z terminu`) : T('Moved by you from','Przeniesiona przez Ciebie z terminu')} ${fmtDay(parseKey(b.movedFrom.date))}, ${b.movedFrom.start}</div>` : ''}
      ${b.book && who === 'tutor' && !past ?`<div class="lsub">${T('Textbook','Podręcznik')}: ${esc(tx(b.book))}</div>` : ''}
    </div>
    <div class="lact">${act}</div></li>`;
}
function listOr(items, who, empty){ return items.length ? `<ul class="list">${items.map(b => lessonRow(b, who)).join('')}</ul>` : `<div class="card empty">${empty}</div>`; }

function viewPayments(){
  const me = tutor(ME), mine = BOOKINGS.filter(b => b.tutorId === ME), mk = key(TODAY).slice(0,7);
  const pre = mine.filter(b => b.status === 'confirmed' && !isPast(b) && b.paid);
  const held = mine.filter(b => b.status === 'pending' && !isPast(b) && b.paid && b.paid.hold);
  const earned = mine.filter(b => b.paid && !b.paid.hold && (b.forfeit || (b.status === 'confirmed' && isPast(b))) && b.date.slice(0,7) === mk);
  const kept = earned.filter(b => b.forfeit);
  const back = mine.filter(b => b.refunded || b.released);
  const cat = b => (b.refunded || b.released || b.credited) ? 'back' : b.paid && b.paid.hold ? 'held' : (b.forfeit || isPast(b)) ? 'out' : 'up';
  const f = ui.payFilter;

function bookingPanel(t){
  const p = ui.pick;
  const rs = ui.resched ? BOOKINGS.find(b => b.id === ui.resched && b.tutorId === t.id) : null;
  if (rs) Object.assign(p, {subject:rs.subject, level:rs.level, duration:rs.duration, mode:rs.mode});
  const off = t.offerings.find(o => o.subject === p.subject) || t.offerings.find(o => o.subject === ui.findSubject) || t.offerings[0];
  p.subject = off.subject;
  if (!off.levels.includes(p.level)) p.level = off.levels[0];
  if (!off.modes.includes(p.mode)) p.mode = off.modes[0];
  const w0 = addDays(WEEK0, ui.findWeek*7);
  const rules = rulesFor(t, w0);
  if (!rs && !rules.durations.includes(p.duration)) p.duration = rules.durations.includes(60) ? 60 : rules.durations[0];
  const maxWeek = Math.ceil((rules.horizon*7 + dayIdx(TODAY)) / 7);
  const days = [...Array(7)].map((_,i) => addDays(w0, i));
  const needsOk = rules.approval && (ui.guest || isNewStudent(t.id));
  const first = esc(firstName(t));
  const price = lessonPrice(off, p.level, p.duration), extra = extraOf(off, p.level);
  const noticeTxt = rules.notice >= 24 ? P(rules.notice/24,'day') : P(rules.notice,'hour');
  const dis = rs ? 'disabled' : '';

  const week = days.map(d => {
    const k = key(d), slots = d < TODAY ? null : slotsFor(t, d, p.duration);
    return `<div class="wday${k===key(TODAY)?' today':''}"><h4>${wdShort(d)} <b>${d.getDate()}</b></h4><div class="slots">
      ${slots === null ? `<span class="no-slots">${T('Past','Minęło')}</span>` : slots.length ? slots.map(m => {
        const sel = p.slot && p.slot.date === k && p.slot.m === m;
        return `<button class="slot" aria-pressed="${!!sel}" data-act="pickSlot" data-date="${k}" data-m="${m}">${toTime(m)}</button>`;
      }).join('') : `<span class="no-slots">${T('No free times','Brak terminów')}</span>`}
    </div></div>`;
  }).join('');

  const sel = p.slot ? parseKey(p.slot.date) : null;
  const summary = p.slot ? `
    <div class="summary">
      <div><p class="eyebrow">${rs ? T('New time','Nowy termin') : T('Your lesson','Twoja lekcja')}</p>
        <p class="big">${fmtDay(sel)}, ${toTime(p.slot.m)}–${toTime(p.slot.m + p.duration)}</p>
        <p class="hint" style="color:var(--ink-2)">${sname(p.subject)} · ${esc(lv(p.level))} · ${p.mode === 'online' ? 'Online, ' + esc(t.platform) : T('In person','Stacjonarnie')} · <b>${money(price)}</b></p>${extra ? `<p class="hint">${T(`Base ${money(off.price)}/h + ${money(extra)}/h for ${esc(lv(p.level))}`,`Stawka ${money(off.price)}/h + dopłata ${money(extra)}/h za poziom: ${esc(lv(p.level))}`)}</p>` : ''}</div>
      ${rs ? `<p class="hint" style="color:var(--ink-2)">${T(`Your ${money(rs.price)} payment moves to the new time. ${first} gets a notification.`,`Płatność ${money(rs.price)} przechodzi na nowy termin. Korepetytor dostanie powiadomienie.`)}</p>` : `

/* ---------- Lesson page (shared by tutor and student) ---------- */
function lessonPhase(b){
  if (b.status === 'pending') return isPast(b) ? 'expired' : 'request';
  if (b.status === 'declined' || b.status === 'cancelled' || b.status === 'noshow') return b.status;
  if (isPast(b)) return 'after';
  if (ui.liveId === b.id || Date.now() >= bStart(b).getTime()) return 'live';
  return 'upcoming';
}
const nextLater = b => BOOKINGS.filter(x => x !== b && x.tutorId === b.tutorId && x.student === b.student && live(x) && bStart(x) > bStart(b)).sort(byStart)[0];
function suggestNext(b){
  const t = tutor(b.tutorId), m0 = toMin(b.start);
  for (let w = 1; w <= 6; w++){
    const d = addDays(parseKey(b.date), 7*w); if (d < TODAY) continue;
    if (slotsFor(t, d, b.duration).includes(m0)) return {date:key(d), m:m0, same:true};
  }
  for (let i = 1; i < 42; i++){ const d = addDays(TODAY, i), s = slotsFor(t, d, b.duration); if (s.length) return {date:key(d), m:s[0], same:false}; }
  return null;
}
const fmtStamp = ts => { const d = new Date(ts); return `${fmtDM(d)}, ${toTime(d.getHours()*60 + d.getMinutes())}`; };
const ext = f => (String(f).split('.').pop() || '').slice(0,4).toUpperCase();
function requestQuotes(b){
  return `${tx(b.note) ? `<div class="quote"><small>${T('What to work on','Nad czym pracować')}</small>${esc(tx(b.note))}</div>` : ''}${tx(b.book) ? `<div class="quote"><small>${T('Textbook & class','Podręcznik i klasa')}</small>${esc(tx(b.book))}</div>` : ''}`;
}
function linksList(links, id, field){
  if (!links || !links.length) return '';
  return `<ul class="links">${links.map((l,i) => `<li><span class="kind">${/youtu/i.test(l.url) ? 'YouTube' : 'Link'}</span><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a>${field ? `<button class="btn ghost sm icon" data-act="linkDel" data-id="${id}" data-field="${field}" data-i="${i}" aria-label="${T('Remove link','Usuń link')}">×</button>` : ''}</li>`).join('')}</ul>`;

const addLinkForm = (field, id) => `<div class="add-link"><input type="text" data-bind="link" data-f="label" value="${esc(ui.linkDraft.label)}" placeholder="${T('Title','Tytuł')}" aria-label="${T('Link title','Tytuł linku')}"><input type="text" data-bind="link" data-f="url" value="${esc(ui.linkDraft.url)}" placeholder="https://youtube.com/…" aria-label="${T('Link address','Adres linku')}"><button class="btn sm" data-act="linkAdd" data-field="${field}" data-id="${id}">${T('Add','Dodaj')}</button></div>`;
function cancelText(b){
  const by = b.cancelledBy === 'tutor' ? T('Cancelled by the tutor.','Odwołana przez korepetytora.') : T('Cancelled by the student.','Odwołana przez ucznia.');
  const what = b.forfeit ? T(`Late cancellation: the ${money(b.price)} prepayment was kept under the cancellation policy.`,`Późne odwołanie: przedpłata ${money(b.price)} została zatrzymana zgodnie z zasadami odwołań.`)
    : b.refunded ? T(`${money(b.price)} was refunded.`,`${money(b.price)} zwrócono.`)
    : b.credited ? T(`${money(b.price)} was kept as credit for the next booking.`,`${money(b.price)} zostało jako kredyt na kolejną rezerwację.`)
    : b.released ? T('The hold was released, nothing was charged.','Blokada zniknęła, nic nie pobrano.') : '';
  return `${by} ${what}`;
}
function flowBar(b, ph){
  const later = nextLater(b), stopped = ['declined','expired','cancelled','noshow'].includes(ph), noLesson = ph === 'declined' || ph === 'expired';
  const payTxt = b.paid ? (b.paid.hold ? T('Amount on hold','Kwota zablokowana') : `${money(b.price)} · ${pm(b.paid.method)}`) : ((payOf(b) || [''])[0]);
  const isT = ui.role === 'tutor';
  const steps = [
    ['done', T('Booked & paid','Rezerwacja i płatność'), payTxt],
    ph === 'request' ? ['cur', T('Confirmation','Akceptacja'), T('Waiting for the tutor','Czeka na korepetytora')]
      : noLesson ? ['fail', T('Confirmation','Akceptacja'), ph === 'declined' ? T('Declined','Odrzucona') : T('Expired','Wygasła')]
      : ['done', T('Confirmation','Akceptacja'), T('Confirmed','Potwierdzona')],
    stopped ? [noLesson ? 'todo' : 'fail', T('Lesson','Lekcja'), noLesson ? '' : statusOf(b)[0]]
      : ph === 'after' ? ['done', T('Lesson','Lekcja'), T('Done','Odbyta')]
      : ph === 'request' ? ['todo', T('Lesson','Lekcja'), fmtDay(bStart(b))]
      : ['cur', T('Lesson','Lekcja'), ph === 'live' ? T('In progress','Trwa') : fmtDay(bStart(b))],
    ph === 'after' ? [b.summary ? 'done' : 'cur', T('Notes','Notatki'), b.summary ? T('Sent to the student','Wysłane uczniowi') : isT ? T('To add','Do uzupełnienia') : T('Coming soon','Wkrótce')] : ['todo', T('Notes','Notatki'), ''],
    later ? ['done', T('Next lesson','Kolejna lekcja'), fmtDay(bStart(later))]
      : ph === 'after' && b.summary ? ['cur', T('Next lesson','Kolejna lekcja'), T('Suggested','Zaproponowana')] : ['todo', T('Next lesson','Kolejna lekcja'), ''],
  ];
  return `<ol class="flow" aria-label="${T('Lesson progress','Etapy lekcji')}">${steps.map(([s, title, sub]) => `<li class="${s}"><b>${title}</b><span>${sub || '&nbsp;'}</span></li>`).join('')}</ol>`;
}

function exRange(){ const dr = ui.drawer; return dr.kind === 'off' && dr.allDay ? [0, 1440] : [toMin(dr.start), toMin(dr.end)]; }
function exWarn(){
  const dr = ui.drawer; if (!dr || dr.type !== 'exform') return '';
  const [s, e] = exRange();
  if (!dr.date) return `<div class="notice bad">${T('Choose a date.','Wybierz datę.')}</div>`;
  if (e <= s) return `<div class="notice bad">${T('The end time must be after the start time.','Godzina końca musi być późniejsza niż godzina początku.')}</div>`;
  if (dr.kind === 'off'){
    const hit = BOOKINGS.filter(b => b.tutorId === ME && b.date === dr.date && live(b) && toMin(b.start) < e && toMin(b.start) + b.duration > s);
    const names = hit.map(b => `${esc(b.student)} ${T('at','o')} ${b.start}`).join(', ');
    if (hit.length) return `<div class="notice">${T(`${P(hit.length,'lesson')} already booked in this time (${names}). ${hit.length>1?'They stay':'It stays'} booked until you cancel.`,`W tym czasie są już zarezerwowane lekcje: ${hit.length} (${names}). Pozostaną aktywne, dopóki ich nie odwołasz.`)}</div>`;
  }
  return '';
}

const VIEW_FN = {calendar:viewCalendar, schedules:viewSchedules, lessons:viewLessons, payments:viewPayments, reviews:viewReviews, profile:viewProfile, find:viewFind, 'my-lessons':viewMyLessons, tutor:viewTutorPage, lesson:viewLesson};

  $('#main').innerHTML = VIEW_FN[ui.view]() + `<p class="foot">${T('Prototype with sample tutors and students. Payments, emails, texts and calendar invites are simulated. Changes stay in this tab until you reload.','Prototyp z przykładowymi korepetytorami i uczniami. Płatności, maile, SMS-y i zaproszenia do kalendarza są symulowane. Zmiany zostają w tej karcie do odświeżenia strony.')} <a href="flow.html">${T('See the whole flow','Zobacz całe flow')}</a></p>`;
  renderDrawer();
  drawQR();
  const th = document.getElementById('thread'); if (th) th.scrollTop = th.scrollHeight;

let toastTimer;
let undoFn = null;
function toast(msg, undo){
  undoFn = undo || null;
  $('#toast-root').innerHTML = `<div class="toast" role="status"><span>${msg}</span>${undo ? `<button class="toast-undo" data-act="undo">${T('Undo','Cofnij')}</button>` : ''}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; undoFn = null; }, undo ? 6500 : 3600);
}
function route(){
  const h = location.hash.slice(1);
  const lb = h.startsWith('l-') && BOOKINGS.find(b => b.id === h.slice(2));
  if (lb){
    if (ui.lessonId !== lb.id){ ui.sumDraft = null; ui.sumEdit = null; ui.fbDraft = null; ui.fbEdit = null; ui.msg = ''; ui.linkDraft = {label:'', url:''}; }
    ui.view = 'lesson'; ui.lessonId = lb.id;
    if (ui.role === 'student' && lb.student !== STUDENT.name) ui.role = 'tutor';
    if (ui.role === 'tutor' && lb.tutorId !== ME) ui.role = 'student';
  } else if (h.startsWith('t-') && tutor(h.slice(2))){
    ui.view = 'tutor'; ui.role = 'student';
    if (ui.tutorId !== h.slice(2)){ ui.tutorId = h.slice(2); ui.findWeek = 0; ui.pick.slot = null; }
  } else {
    ui.view = VIEWS[h] ? h : 'calendar'; ui.role = VIEWS[ui.view];
    if (ui.role === 'student' && ui.guest) ui.view = 'tutor';
  }
  if (ui.view !== 'tutor' && ui.view !== 'find') ui.resched = null;
  ui.drawer = ui.nextDrawer; ui.nextDrawer = null; ui.confirmCancel = null; ui.replyFor = null;
  render(); window.scrollTo(0, 0);
}
function go(view){ if (location.hash.slice(1) === view) route(); else location.hash = view; }

/* ---------- actions ---------- */
const firstName = t => t.name.split(' ')[0];
const ACT = {
  role: el => { if (el.dataset.role === 'tutor'){ ui.guest = false; go('calendar'); } else go(ui.guest ? 't-' + ui.tutorId : 'find'); },
  lang: el => setLang(el.dataset.v),
  undo: () => { const f = undoFn; undoFn = null; $('#toast-root').innerHTML = ''; f && f(); },
  moveDo: el => {
    const b = BOOKINGS.find(x => x.id === el.dataset.id), date = $('#mv-date').value, tm = $('#mv-start').value, w = $('#mv-warn');
    if (!date || !tm){ w.innerHTML = `<div class="notice bad">${T('Pick a date and a start time.','Wybierz datę i godzinę rozpoczęcia.')}</div>`; return; }
    const s = toMin(tm);
    if (s + b.duration > 1440){ w.innerHTML = `<div class="notice bad">${T('The lesson has to end before midnight.','Lekcja musi skończyć się przed północą.')}</div>`; return; }
    if (b.date === date && toMin(b.start) === s){ w.innerHTML = `<div class="notice">${T('That’s the time it already has.','Lekcja już ma ten termin.')}</div>`; return; }
    const [st, why] = moveCheck(b, date, s);
    if (st === 'bad'){ w.innerHTML = `<div class="notice bad">${esc(why)}.</div>`; return; }
    ui.drawer = null; moveBooking(b, date, s, st === 'warn');
  },
  theme: el => setTheme(el.dataset.v),
  close: () => { ui.drawer = null; ui.confirmCancel = null; renderDrawer(); },
  calPrev: () => { ui.calWeek--; render(); },
  calNext: () => { ui.calWeek++; render(); },
  calToday: () => { ui.calWeek = 0; render(); },
  openLesson: el => { ui.drawer = null; go('l-' + el.dataset.id); },
  ex: el => { ui.drawer = {type:'ex', id:el.dataset.id}; renderDrawer(); },
  col: (el, e) => {
    const r = el.getBoundingClientRect();
    const m = Math.min(CAL_END - 60, CAL_START + Math.floor((e.clientY - r.top) / 30) * 30);
    const inside = rangesFor(tutor(ME), parseKey(el.dataset.date)).some(x => m >= x.s && m < x.e);
    ui.drawer = {type:'exform', kind: inside ? 'off' : 'extra', date: el.dataset.date, start: toTime(m), end: toTime(m + 60), note:'', allDay:false};
    renderDrawer();
  },
  newEx: el => {
    const d = ui.calWeek === 0 ? TODAY : addDays(WEEK0, ui.calWeek*7);
    ui.drawer = {type:'exform', kind: el.dataset.kind, date:key(d), start: el.dataset.kind === 'off' ? '15:00' : '10:00', end: el.dataset.kind === 'off' ? '17:00' : '13:00', note:'', allDay: el.dataset.kind === 'off'};
    renderDrawer();
  },
  exKind: el => { ui.drawer.kind = el.dataset.v; renderDrawer(); },
  saveEx: () => {
    const dr = ui.drawer, [s, e] = exRange();
    if (!dr.date || e <= s){ const w = $('#ex-warn'); if (w) w.innerHTML = exWarn(); return; }
    tutor(ME).exceptions.push({id:nid('x'), date:dr.date, type:dr.kind, start:toTime(s), end:e >= 1440 ? '24:00' : toTime(e), note:dr.note.trim()});
    ui.calWeek = weeksBetween(TODAY, parseKey(dr.date)); ui.drawer = null; render();
    const day = fmtDay(parseKey(dr.date));
    toast(dr.kind === 'off' ? T(`Time blocked on ${day}`,`Zablokowano czas: ${day}`) : T(`Extra hours added on ${day}`,`Dodano godziny: ${day}`));
  },
  delEx: el => { const me = tutor(ME); me.exceptions = me.exceptions.filter(x => x.id !== el.dataset.id); ui.drawer = null; render(); toast(T('Removed from your calendar','Usunięto z kalendarza')); },
  accept: el => {
    const b = BOOKINGS.find(x => x.id === el.dataset.id); b.status = 'confirmed';
    if (b.paid){ b.paid.hold = false; b.paid.on = key(TODAY); }
    render(); toast(T(`Confirmed. ${money(b.price)} charged and ${esc(b.student)} notified.`,`Potwierdzono. Pobrano ${money(b.price)}, uczeń dostał powiadomienie.`));
  },
  decline: el => {
    const b = BOOKINGS.find(x => x.id === el.dataset.id); b.status = 'declined';
    if (b.paid) releaseHold(b);
    render(); toast(T(`Declined. The hold was released and ${esc(b.student)} notified.`,`Odrzucono. Blokada zniknęła, uczeń dostał powiadomienie.`));
  },
  askCancel: el => { ui.confirmCancel = el.dataset.id; render(); },
  keep: () => { ui.confirmCancel = null; render(); },
  doCancel: el => {
    const b = BOOKINGS.find(x => x.id === el.dataset.id), mode = el.dataset.mode, amt = money(b.price), first = esc(firstName(tutor(b.tutorId)));
    const method = b.paid ? pm(b.paid.method) : '';
    b.status = 'cancelled'; b.cancelledBy = ui.role; b.late = mode === 'late';
    let msg;

  plan: el => { BOOKINGS.find(x => x.id === el.dataset.id).plan = el.value; },
  liveNote: el => { BOOKINGS.find(x => x.id === el.dataset.id).liveNote = el.value; },
  link: el => { ui.linkDraft[el.dataset.f] = el.value; },
  sum: el => { ui.sumDraft[el.dataset.f] = el.value; },
  files: el => { ui.sumDraft.files.push(...[...el.files].map(f => f.name)); render(); },
  fb: el => { ui.fbDraft.text = el.value; },
  msg: el => { ui.msg = el.value; },
};
function onEdit(e){
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b || !BIND[b]) return;
  const discrete = el.tagName === 'SELECT' || el.type === 'checkbox';
  if (discrete !== (e.type === 'change')) return;
  BIND[b](el);
}

/* ---------- language & theme ---------- */
function setLang(l){
  LANG = l === 'pl' ? 'pl' : 'en';
  renderChrome(); render();
}
function currentTheme(){
  const set = document.documentElement.getAttribute('data-theme');
  if (set === 'light' || set === 'dark') return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function paintThemeSwitch(){
  const t = currentTheme();
  document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === t));
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('korki-theme', t); } catch (e) {}
  paintThemeSwitch();
}
try { const saved = localStorage.getItem('korki-theme'); if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
LANG = 'pl'; /* always start in Polish; the PL/EN switch applies to the current visit only */
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', paintThemeSwitch);

document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
document.addEventListener('pointerdown', dragStart);
document.addEventListener('pointermove', dragMove, {passive:false});
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (drag) e.preventDefault(); });
document.addEventListener('click', e => { if (swallowClick && e.target.closest?.('.cal-wrap')){ swallowClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drag){ dragEnd(null); return; }
  if (e.key === 'Escape' && ui.drawer){ ui.drawer = null; ui.confirmCancel = null; renderDrawer(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.dataset && e.target.dataset.bind === 'msg'){
    e.preventDefault(); const btn = document.querySelector('[data-act="send"]'); if (btn) ACT.send(btn);
  }
});
window.addEventListener('hashchange', route);
setInterval(() => { if (ui.view === 'calendar') { const n = document.querySelector('.now'); if (n){ const d = new Date(), m = d.getHours()*60 + d.getMinutes(); n.style.top = (m - CAL_START) + 'px'; } } }, 60000);
renderChrome();
paintThemeSwitch();
route();
</script>
